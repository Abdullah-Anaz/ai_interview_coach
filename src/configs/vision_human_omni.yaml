domain: "skeletal_kinematics"
device: "cuda"

model_config:
  active_model: "human_omni"
  architecture: "human_omni"
  omni_weights_path: "src/models/weights/human_omni.pth"
  feature_dim: 512
  num_joints: 33
  target_resolution: 224
  margin: 20

data_config:
  manifest_path: "src/data/vision/manifest.csv"
  batch_size: 1

evaluation:
  output_results_path: "src/results/vision/human_omni.csv"
  min_cutoff: 1.0
  beta: 0.004
  d_cutoff: 1.0
  checkpoint_interval: 20
experiment_name: "transcription_benchmark_parakeet"
domain: "transcription"

device: "gpu"

model_config:
  architecture: "parakeet-tdt-0.6b-v3"
  framework: "nemo"
  precision: "fp16"

data_config:
  manifest_path: "src/data/transcription/benchmark_disfluency/benchmark_manifest.csv"
  batch_size: 1
  sample_rate: 16000
  chunk_save_frequency: 20

evaluation:
  primary_metric: "WER"
  preserve_disfluencies: true
  checkpoint_path: "src/results/checkpoints/parakeet_checkpoint.json"
  output_results_path: "src/results/transcription_parakeet_results.csv"